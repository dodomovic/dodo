# BosNRoll günlük teknoloji bülteni ayarları

channel:
  name: BosNRoll
  language: tr

news:
  # Son kaç saatin haberleri değerlendirilsin
  max_age_hours: 30
  # LLM'e aday olarak gönderilecek en fazla haber sayısı
  max_candidates: 40
  feeds:
    Webtekno: https://www.webtekno.com/rss.xml
    ShiftDelete: https://shiftdelete.net/feed
    DonanımHaber: https://www.donanimhaber.com/rss/tum/
    The Verge: https://www.theverge.com/rss/index.xml
    TechCrunch: https://techcrunch.com/feed/
    Ars Technica: https://feeds.arstechnica.com/arstechnica/index

script:
  model: claude-opus-5-5
  effort: high
  stories_per_episode: 3
  # EMA Lightning ~2,4 kelime/sn okuyor; 5 dakika ≈ 700 kelime
  target_words: 700

tts:
  # voxcpm: kanal sahibinin klonlanmış sesi (doğal, yavaş) · ema: EMA Lightning hazır ses (hızlı)
  engine: voxcpm
  voxcpm:
    model: openbmb/VoxCPM2
    # Ses kaydı herkese açık repoda düz durmaz: assets/voice/ref.wav.gpg şifreli saklanır,
    # iş akışı VOICE_PASSPHRASE secret'ıyla bu yollara açar.
    reference_wav: assets/voice/ref.wav
    reference_text: assets/voice/ref.txt
    cfg_value: 2.0
    inference_timesteps: 10
    # İngilizce isimleri kendisi doğru okuyor; sadece gerektiğinde ekleyin
    lexicon:
      # Yazılışı BosNRoll, okunuşu "Boşnroll". Ek alınca bozuluyor: senaryoda "BosNRoll kanalı" kullanılır.
      BosNRoll: Boşn Roll
      5N1K: beş en bir ka
  # Sadece ema motoru için: 1.0 normal hız
  speed: 1.0
  # Cümleler arası ve bölümler arası sessizlik (saniye)
  sentence_pause: 0.35
  beat_pause: 0.8
  seed: 0

video:
  # Sahneler 1920x1080 tasarlanır; scale: 2 → 3840x2160 (4K)
  scale: 2
  fps: 25
  # assets/music.mp3 varsa bu seviyede alta karıştırılır
  music_volume: 0.08

youtube:
  category_id: "28"        # Science & Technology
  privacy: private         # onaydan sonra public yapılır
  made_for_kids: false
  contains_synthetic_media: true

# EMA Lightning motoru için: seslendirme öncesi yabancı kelimelerin Türkçe okunuşu.
# Altyazıda orijinal yazım görünür, sadece seslendirmeye uygulanır.
# Büyük/küçük harf duyarlı, uzun ifadeler önce uygulanır.
