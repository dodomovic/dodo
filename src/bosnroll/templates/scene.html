<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Oswald"; font-weight: 700; src: url("../../../assets/fonts/Oswald-700-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("../../../assets/fonts/Oswald-700.woff2") format("woff2");
  unicode-range: U+0100-0130, U+0132-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0; }
@font-face { font-family: "Inter"; font-weight: 500; src: url("../../../assets/fonts/Inter-500-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
@font-face { font-family: "Inter"; font-weight: 500; src: url("../../../assets/fonts/Inter-500.woff2") format("woff2");
  unicode-range: U+0100-0130, U+0132-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0; }
@font-face { font-family: "Inter"; font-weight: 800; src: url("../../../assets/fonts/Inter-800-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
@font-face { font-family: "Inter"; font-weight: 800; src: url("../../../assets/fonts/Inter-800.woff2") format("woff2");
  unicode-range: U+0100-0130, U+0132-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0; }

:root {
  --bg: #08080a;
  --panel: rgba(255, 255, 255, 0.035);
  --line: rgba(255, 140, 60, 0.18);
  --neon: #ff6a1a;
  --neon-hot: #ffb27a;
  --text: #f4efe9;
  --muted: #8d857e;
  --glow: 0 0 6px rgba(255, 106, 26, .9), 0 0 22px rgba(255, 77, 0, .65), 0 0 60px rgba(255, 77, 0, .35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background:
    radial-gradient(900px 600px at 12% 108%, rgba(255, 80, 10, .22), transparent 70%),
    radial-gradient(700px 500px at 100% -10%, rgba(255, 80, 10, .10), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: "Inter", sans-serif;
  font-weight: 500;
  position: relative;
}
body::before { /* ince ızgara dokusu */
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}
.oswald { font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.neon { color: var(--neon-hot); text-shadow: var(--glow); }

/* Üst bar */
header { position: absolute; top: 40px; left: 80px; right: 80px; height: 80px; display: flex; align-items: center; gap: 28px; }
header img { height: 80px; }
header .show { font-family: "Oswald"; font-weight: 700; font-size: 26px; letter-spacing: .14em; color: var(--muted); }
header .spacer { flex: 1; }
header .date { font-size: 24px; color: var(--muted); letter-spacing: .06em; }
.pills { display: flex; gap: 10px; }
.pill { width: 54px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); }
.pill.done { background: rgba(255,106,26,.45); }
.pill.on { background: var(--neon); box-shadow: 0 0 12px var(--neon); }

main { position: absolute; top: 160px; left: 80px; right: 80px; bottom: 210px; }

/* Altyazı */
.sub {
  position: absolute; left: 160px; right: 160px; bottom: 56px; min-height: 120px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-weight: 800; font-size: 44px; line-height: 1.25; color: #fff;
  padding: 18px 40px; border-radius: 14px;
  background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.06);
  text-wrap: balance;
}
.sub:empty { display: none; }

.kicker { display: inline-block; padding: 8px 18px; border: 2px solid var(--neon); border-radius: 999px;
  font-family: "Oswald"; font-weight: 700; font-size: 26px; letter-spacing: .12em; color: var(--neon-hot);
  box-shadow: 0 0 14px rgba(255,106,26,.45), inset 0 0 14px rgba(255,106,26,.25); }
.source { color: var(--muted); font-size: 26px; margin-top: 28px; }
.source b { color: var(--text); font-weight: 800; }

/* intro / outro */
.center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
.center img { width: 900px; }
.center .tag { font-size: 34px; letter-spacing: .3em; color: var(--muted); font-family: "Oswald"; font-weight: 700; }
.toc { display: flex; gap: 24px; margin-top: 18px; }
.toc div { width: 520px; padding: 22px 26px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  text-align: left; font-size: 26px; line-height: 1.3; }
.toc span { display: block; font-family: "Oswald"; font-weight: 700; color: var(--neon); font-size: 22px; letter-spacing: .12em; margin-bottom: 8px; }

/* headline */
.headline { height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 1500px; }
.headline .num { font-family: "Oswald"; font-weight: 700; font-size: 30px; letter-spacing: .2em; color: var(--muted); margin-bottom: 22px; }
.headline h1 { font-family: "Oswald"; font-weight: 700; font-size: 104px; line-height: 1.04; text-transform: uppercase; margin-top: 28px; }

/* 5N1K ızgarası */
.wtop { display: flex; align-items: baseline; gap: 22px; margin-bottom: 26px; }
.wtop h2 { font-family: "Oswald"; font-weight: 700; font-size: 40px; text-transform: uppercase; color: var(--text); opacity: .9;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; height: 590px; }
.card { position: relative; border-radius: 18px; padding: 30px 32px; background: var(--panel); border: 1.5px solid var(--line);
  display: flex; flex-direction: column; gap: 16px; transition: none; }
.card .k { font-family: "Oswald"; font-weight: 700; font-size: 44px; letter-spacing: .06em; color: var(--muted); }
.card .v { font-size: 34px; line-height: 1.28; font-weight: 800; }
.card.hidden .v { color: rgba(255,255,255,.12); font-family: "Oswald"; font-size: 90px; line-height: 1; }
.card.on { border-color: var(--neon); background: rgba(255, 90, 20, .08);
  box-shadow: 0 0 0 1px var(--neon), 0 0 30px rgba(255,106,26,.45), inset 0 0 40px rgba(255,106,26,.12); }
.card.on .k { color: var(--neon-hot); text-shadow: var(--glow); }

/* sorgu */
.sorgu { height: 100%; display: grid; grid-template-columns: 380px 1fr; align-items: center; gap: 60px; }
.sorgu .q { font-family: "Oswald"; font-weight: 700; font-size: 420px; line-height: 1; text-align: center; }
.sorgu .label { font-family: "Oswald"; font-weight: 700; font-size: 34px; letter-spacing: .2em; color: var(--neon); margin-bottom: 26px; }
.sorgu .text { font-family: "Oswald"; font-weight: 700; font-size: 86px; line-height: 1.1; text-transform: uppercase; }

/* karar */
.verdict { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center; }
.verdict .label { font-family: "Oswald"; font-weight: 700; font-size: 34px; letter-spacing: .3em; color: var(--muted); }
.verdict .box { padding: 26px 70px; border: 4px solid var(--neon); border-radius: 22px;
  box-shadow: 0 0 22px rgba(255,106,26,.7), inset 0 0 22px rgba(255,106,26,.35); }
.verdict .big { font-family: "Oswald"; font-weight: 700; font-size: 130px; line-height: 1.05; }
.verdict .text { font-size: 40px; max-width: 1300px; line-height: 1.3; font-weight: 800; }

/* thumbnail */
body.thumb { width: 1280px; height: 720px; }
.thumbwrap { position: absolute; inset: 0; padding: 48px 64px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.thumbwrap img { width: 420px; margin-left: -20px; }
.thumbwrap h1 { font-family: "Oswald"; font-weight: 700; font-size: 100px; line-height: 1; text-transform: uppercase; max-width: 900px; }
.thumbwrap .chip { align-self: flex-start; font-family: "Oswald"; font-weight: 700; font-size: 40px; padding: 8px 22px; background: var(--neon); color: #120800; border-radius: 10px; }
.thumbwrap .q { position: absolute; right: 40px; top: 10px; font-family: "Oswald"; font-weight: 700; font-size: 520px; line-height: 1; opacity: .9; }

/* ---------- Belgesel sahneleri ---------- */
:root { --ice: #7fd6ff; --ice-dim: rgba(127, 214, 255, .35); }
.dtitle { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
.dtitle img { width: 620px; margin-left: -24px; }
.dtitle h1 { font-family: "Oswald"; font-weight: 700; font-size: 150px; line-height: 1; text-transform: uppercase; }
.dtitle .s { font-size: 40px; color: var(--muted); font-weight: 800; }
.chap { height: 100%; display: flex; align-items: center; gap: 70px; }
.chap .n { font-family: "Oswald"; font-weight: 700; font-size: 380px; line-height: .9; }
.chap .lbl { font-family: "Oswald"; font-weight: 700; font-size: 34px; letter-spacing: .3em; color: var(--neon); }
.chap h1 { font-family: "Oswald"; font-weight: 700; font-size: 120px; line-height: 1.02; text-transform: uppercase; margin: 14px 0 22px; }
.chap .s { font-size: 40px; color: var(--muted); font-weight: 800; }
.stat { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 34px; }
.stat .v { font-family: "Oswald"; font-weight: 700; font-size: 220px; line-height: .95; }
.stat .l { font-size: 52px; font-weight: 800; line-height: 1.25; max-width: 1500px; }
.stat .f { font-size: 30px; color: var(--muted); }
.tl { height: 100%; display: flex; flex-direction: column; justify-content: center; }
.tl .row { position: relative; display: grid; gap: 0; }
.tl .line { position: absolute; left: 0; right: 0; top: 118px; height: 4px; background: rgba(255,255,255,.12); }
.tl .item { position: relative; padding: 0 14px; text-align: center; }
.tl .y { font-family: "Oswald"; font-weight: 700; font-size: 54px; color: var(--muted); height: 90px; display: flex; align-items: flex-end; justify-content: center; }
.tl .dot { width: 30px; height: 30px; border-radius: 50%; margin: 14px auto 30px; background: #2a2622; border: 3px solid rgba(255,255,255,.2); position: relative; z-index: 1; }
.tl .t { font-size: 30px; line-height: 1.3; color: var(--muted); font-weight: 800; }
.tl .item.done .dot { background: rgba(255,106,26,.5); border-color: rgba(255,106,26,.7); }
.tl .item.done .y { color: #c9b9aa; }
.tl .item.on .dot { background: var(--neon); border-color: var(--neon-hot); box-shadow: 0 0 22px var(--neon); }
.tl .item.on .y { color: var(--neon-hot); text-shadow: var(--glow); font-size: 64px; }
.tl .item.on .t { color: var(--text); font-size: 34px; }
.dlist { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.dlist h2 { font-family: "Oswald"; font-weight: 700; font-size: 84px; text-transform: uppercase; margin-bottom: 14px; }
.dlist li { list-style: none; font-size: 46px; font-weight: 800; line-height: 1.25; padding-left: 58px; position: relative; }
.dlist li::before { content: ""; position: absolute; left: 0; top: 18px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--neon); box-shadow: 0 0 14px var(--neon); }
.dlist .note { font-size: 32px; color: var(--muted); margin-top: 16px; }
.dquote { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 34px; max-width: 1560px; }
.dquote .mark { font-family: "Oswald"; font-weight: 700; font-size: 260px; line-height: .6; height: 130px; }
.dquote .t { font-family: "Oswald"; font-weight: 700; font-size: 82px; line-height: 1.15; }
.dquote .w { font-size: 34px; color: var(--muted); font-weight: 800; }
.laur { height: 100%; display: grid; grid-template-columns: 420px 1fr; align-items: center; gap: 70px; }
.laur .medal { width: 400px; height: 400px; border-radius: 50%; border: 6px solid var(--neon); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(255,106,26,.6), inset 0 0 40px rgba(255,106,26,.35); font-family: "Oswald"; font-weight: 700; font-size: 120px; }
.laur h1 { font-family: "Oswald"; font-weight: 700; font-size: 120px; text-transform: uppercase; margin-bottom: 24px; }
.laur li { list-style: none; font-size: 40px; font-weight: 800; line-height: 1.5; color: #ddd3c9; }
.laur li::before { content: "— "; color: var(--neon); }
.diag { height: 100%; display: flex; flex-direction: column; }
.diag svg { flex: 1; width: 100%; }
.diag .cap { font-family: "Oswald"; font-weight: 700; font-size: 46px; color: var(--text); text-align: center; margin-top: 6px; }
svg text { font-family: "Inter"; font-weight: 800; fill: var(--text); }
svg .lbl { font-size: 30px; }
svg .dim { opacity: .28; }

/* ---------- Fotoğraf sahnesi ---------- */
.bgphoto { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; }
.bgphoto::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(8,8,10,.94) 0%, rgba(8,8,10,.62) 42%, rgba(8,8,10,.12) 100%),
              linear-gradient(0deg, rgba(8,8,10,.9) 0%, rgba(8,8,10,0) 34%),
              linear-gradient(180deg, rgba(8,8,10,.75) 0%, rgba(8,8,10,0) 18%); }
.pcontent { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 26px; max-width: 1050px; }
.pcontent .k { font-family: "Oswald"; font-weight: 700; font-size: 32px; letter-spacing: .25em; color: var(--neon); text-transform: uppercase; }
.pcontent h1 { font-family: "Oswald"; font-weight: 700; font-size: 104px; line-height: 1.02; text-transform: uppercase; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
.pcontent .v { font-family: "Oswald"; font-weight: 700; font-size: 190px; line-height: .95; }
.pcontent .l { font-size: 46px; font-weight: 800; line-height: 1.25; text-shadow: 0 2px 20px rgba(0,0,0,.8); }
.pcontent li { list-style: none; font-size: 42px; font-weight: 800; line-height: 1.3; padding-left: 52px; position: relative; margin: 6px 0; text-shadow: 0 2px 16px rgba(0,0,0,.8); }
.pcontent li::before { content: ""; position: absolute; left: 0; top: 16px; width: 20px; height: 20px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 14px var(--neon); }
.credit { position: fixed; right: 44px; bottom: 196px; font-size: 20px; color: rgba(255,255,255,.7); text-shadow: 0 1px 6px #000; }
.pside { height: 100%; display: grid; grid-template-columns: 1fr 760px; gap: 70px; align-items: center; }
.pside img, .pwide img { width: 100%; border-radius: 22px; border: 2px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.6); display: block; }
.pside img { max-height: 690px; object-fit: cover; }
.pwide { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
.pwide img { max-height: 470px; object-fit: cover; }
.pside .credit, .pwide .credit { bottom: 196px; }
.laur .medal.ph { background-size: cover; background-position: center 30%; font-size: 0; }

.rthumb { position: absolute; left: 60px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px; }
.rthumb .tlogo { width: 200px; margin: 0 0 4px -6px; }
.rthumb .tchip { font-family: "Oswald"; font-weight: 700; font-size: 32px; letter-spacing: .08em; padding: 4px 18px; background: var(--neon); color: #120800; border-radius: 10px; white-space: nowrap; }
.rthumb .tbig { font-family: "Oswald"; font-weight: 700; font-size: 132px; line-height: .95; text-transform: uppercase; white-space: nowrap; }
.rthumb .tsub { font-family: "Oswald"; font-weight: 700; font-size: 46px; line-height: 1.05; text-transform: uppercase; color: #fff; white-space: nowrap; text-shadow: 0 3px 20px rgba(0,0,0,.9); }
.rthumb .tfoot { font-size: 20px; color: rgba(255,255,255,.75); white-space: nowrap; }
.tface { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 380px; height: 380px; border-radius: 50%;
  background-size: 160%; background-position: 22% 18%; border: 7px solid var(--neon); box-shadow: 0 0 40px rgba(255,106,26,.8), 0 0 90px rgba(255,77,0,.5); }
body.thumb .bgphoto::after { background: linear-gradient(90deg, rgba(8,8,10,.92) 0%, rgba(8,8,10,.6) 55%, rgba(8,8,10,.25) 100%); }

/* ---------- Video kesiti sahnesi ---------- */
.clipbox { background: #000; border-radius: 22px; outline: 2px solid var(--line); outline-offset: 0; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
body.clipfull { background: transparent !important; }
body.clipfull::before { display: none; }
.clipgrad { position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(8,8,10,.88) 0%, rgba(8,8,10,.5) 40%, rgba(8,8,10,0) 75%),
              linear-gradient(0deg, rgba(8,8,10,.85) 0%, rgba(8,8,10,0) 30%),
              linear-gradient(180deg, rgba(8,8,10,.7) 0%, rgba(8,8,10,0) 16%); }

.tlogoimg { position: absolute; right: 110px; top: 50%; transform: translateY(-52%); height: 400px;
  filter: drop-shadow(0 0 14px rgba(255,106,26,.9)) drop-shadow(0 0 40px rgba(255,77,0,.55)); }

body.vthumb { width: 1080px; height: 1920px; }
.vgrad { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(8,8,10,.55) 0%, rgba(8,8,10,.35) 30%, rgba(8,8,10,.85) 62%, rgba(8,8,10,.95) 100%); }
.vwrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 0 60px; }
.vbrand { width: 300px; margin-bottom: 10px; }
.vlogo { height: 300px; margin: 10px 0 30px; filter: drop-shadow(0 0 16px rgba(255,106,26,.9)) drop-shadow(0 0 50px rgba(255,77,0,.55)); }
.vwrap .tchip { font-family: "Oswald"; font-weight: 700; font-size: 44px; letter-spacing: .08em; padding: 6px 26px; background: var(--neon); color: #120800; border-radius: 12px; white-space: nowrap; }
.vbig { font-family: "Oswald"; font-weight: 700; font-size: 150px; line-height: 1; text-transform: uppercase; white-space: nowrap; margin: 10px 0; }
.vline { font-family: "Oswald"; font-weight: 700; font-size: 72px; line-height: 1.05; text-transform: uppercase; color: #fff; white-space: nowrap; text-shadow: 0 3px 20px rgba(0,0,0,.9); }
.vfoot { font-size: 34px; color: rgba(255,255,255,.8); margin-top: 18px; white-space: nowrap; }

.vcta { display: flex; align-items: center; gap: 18px; margin-top: 40px; padding: 18px 34px; border-radius: 999px;
  background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); font-size: 40px; font-weight: 800; color: #fff; white-space: nowrap; }
.vcta .ytlogo { width: 84px; height: 60px; }
.vcta b { color: var(--neon-hot); }
</style>

<body>
<div id="root"></div>
<script>
const LABELS = { kim: "KİM?", ne: "NE?", nerede: "NEREDE?", ne_zaman: "NE ZAMAN?", nasil: "NASIL?", neden: "NEDEN?" };
const ORDER = ["kim", "ne", "nerede", "ne_zaman", "nasil", "neden"];
// Büyük harfe çevrilen yerlerde İngilizce marka adları Türkçe kurala göre "İ" almasın (HOMEVIEW, SIRI)
const EN_WORDS = /\b(HomeView|HomePod|mini|Siri|iPhone|iPad|Wi-Fi|FaceTime|Fitness|Arcade|Disney|Netflix|Prime Video|Music Sing|Sound Glow|Whole Room Audio|Home Collection|Center Stage|AirPods|AirPlay|HomeKit|Dolby Vision|Francis|IceCube|Private Cloud Compute|Secure Exclaves|Snoopy|Edition|Vision)\b/g;
const escPlain = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const esc = s => escPlain(s).replace(EN_WORDS, '<span lang="en">$1</span>');

function header(ep, b) {
  const doc = ep.format === "doc";
  const n = doc ? ep.chapters.length : ep.stories.length, cur = doc ? b.chapter : b.story;
  const pills = Array.from({ length: n }, (_, i) => `<div class="pill ${i === cur ? "on" : i < cur ? "done" : ""}"></div>`).join("");
  const show = doc ? `${esc(ep.stories[0].kicker)}${cur >= 0 ? " · " + esc(ep.chapters[cur]).toLocaleUpperCase("tr") : ""}` : "5N1K · TEKNOLOJİ GÜNDEMİ";
  return `<header><img src="../../../assets/logo.png"><div class="show">${show}</div>
    <div class="spacer"></div><div class="pills">${pills}</div><div class="date">${esc(ep.date_label)}</div></header>`;
}

function sources(st) {
  return `<div class="source">Kaynak: ${st.sources.map(s => `<b>${esc(s.name)}</b>`).join(" · ")}</div>`;
}

function render(f) {
  const ep = f.episode, b = f.beat, st = b.story >= 0 ? ep.stories[b.story] : null;
  let main = "";
  if (b.scene === "intro") {
    main = `<div class="center"><img src="../../../assets/logo.png"><div class="tag">5N1K · TEKNOLOJİ GÜNDEMİ · ${esc(ep.date_label)}</div>
      <div class="toc">${ep.stories.map((s, i) => `<div><span>HABER ${i + 1} · ${esc(s.kicker)}</span>${esc(s.headline)}</div>`).join("")}</div></div>`;
  } else if (b.scene === "outro") {
    main = `<div class="center"><img src="../../../assets/logo.png"><div class="tag">${ep.format === "doc" ? "SİZCE?" : "SİZCE HANGİSİ ABARTILI?"}</div>
      <div class="kicker">YORUMLARA YAZIN · ABONE OLUN</div><div class="source">Tüm kaynaklar açıklamada</div></div>`;
  } else if (b.scene === "headline") {
    main = `<div class="headline"><div class="num">HABER ${b.story + 1} / ${ep.stories.length}</div>
      <div><span class="kicker">${esc(st.kicker)}</span></div><h1>${esc(st.headline)}</h1>${sources(st)}</div>`;
  } else if (b.scene === "w") {
    const cur = ORDER.indexOf(b.key);
    const cards = ORDER.map((k, i) => {
      const cls = i === cur ? "on" : i > cur ? "hidden" : "";
      return `<div class="card ${cls}"><div class="k">${LABELS[k]}</div><div class="v">${i > cur ? "?" : esc(st.w[k])}</div></div>`;
    }).join("");
    main = `<div class="wtop"><span class="kicker">${esc(st.kicker)}</span><h2>${esc(st.headline)}</h2></div><div class="grid">${cards}</div>`;
  } else if (b.scene === "sorgu") {
    main = `<div class="sorgu"><div class="q neon">?</div><div>
      <div class="label">MANTIK SORGUSU ${b.q + 1} / ${st.questions.length}</div>
      <div class="text">${esc(st.questions[b.q])}</div></div></div>`;
  } else if (b.scene === "verdict") {
    main = `<div class="verdict"><div class="label">BOSNROLL KARARI</div>
      <div class="box"><div class="big neon">${esc(st.verdict.label)}</div></div><div class="text">${esc(st.verdict.text)}</div></div>`;
  }
  else if (DOC[b.scene]) main = DOC[b.scene](b.data || {}, ep, b);
  document.body.className = b.scene === "clip" && !["side", "wide"].includes((b.data || {}).layout) ? "clipfull" : "";
  document.getElementById("root").innerHTML =
    header(ep, b) + `<main>${main}</main>${f.subtitle ? `<div class="sub"><span>${esc(f.subtitle)}</span></div>` : ""}`;
}

      <line x1="${x + 160}" y1="390" x2="${x + 160}" y2="160" stroke="${MUTED}" stroke-width="5" marker-end="url(#arrM)"/>${T(x + 160, 140, `Buharlaşma %${et}`, { s: 28 })}
      <line x1="${x + 330}" y1="380" x2="${x + 760}" y2="380" stroke="${ICE}" stroke-width="${Math.min(4 + ro / 6, 12)}" filter="url(#glow)"/>
      <path d="M${x + 760},${380 - 10 - ro / 4} L${x + 800},380 L${x + 760},${380 + 10 + ro / 4} Z" fill="${ICE}"/>${T(x + 540, 340, `Yüzey akışı %${ro}`, { s: 32, c: ICE })}
      <line x1="${x + 330}" y1="420" x2="${x + 330}" y2="480" stroke="${HOT}" stroke-width="5" marker-end="url(#arr)"/>${T(x + 350, 470, `Sığ sızma %${sh}`, { a: "start", s: 26 })}
      <line x1="${x + 600}" y1="420" x2="${x + 600}" y2="540" stroke="${HOT}" stroke-width="5" marker-end="url(#arr)"/>${T(x + 620, 535, `Derin sızma %${dp}`, { a: "start", s: 26 })}`;
    return svg(panel(20, "Doğal zemin", 40, 10, 25, 25, "#2d3a22") + panel(920, "Şehir · %75–100 beton/asfalt", 30, 55, 10, 5, "#3a3a42"));
  },

  // Aynı yağışa doğal ve kentsel havzanın tepkisi (hidrograf)
  hydrograph: () => {
    const ox = 140, oy = 540, w = 1540;
    const rain = Array.from({ length: 8 }, (_, i) => `<rect x="${ox + 60 + i * 34}" y="40" width="26" height="${[40, 90, 150, 120, 70, 40, 20, 10][i]}" fill="${ICE}" opacity=".8"/>`).join("");
    const curve = (peakX, peakY, spread) => { let d = `M${ox},${oy}`; for (let x = 0; x <= w; x += 10) { const y = oy - peakY * Math.exp(-Math.pow((x - peakX) / spread, 2)); d += ` L${ox + x},${y}`; } return d; };
    return svg(`${rain}${T(ox + 200, 30, "yağış", { s: 26, c: ICE })}
      <line x1="${ox}" y1="${oy}" x2="${ox + w}" y2="${oy}" stroke="rgba(255,255,255,.5)" stroke-width="3"/><line x1="${ox}" y1="${oy}" x2="${ox}" y2="200" stroke="rgba(255,255,255,.5)" stroke-width="3"/>
      ${T(ox + w - 60, oy + 44, "zaman →", { s: 26, c: MUTED })}${T(ox - 20, 230, "debi", { a: "end", s: 26, c: MUTED })}
      <path d="${curve(780, 140, 340)}" fill="none" stroke="${MUTED}" stroke-width="6"/>${T(1220, 420, "Doğal havza: geç ve düşük tepe", { s: 28, c: MUTED })}
      <path d="${curve(420, 320, 150)}" fill="none" stroke="${NEON}" stroke-width="7" filter="url(#glow)"/>${T(720, 220, "Şehir: erken ve yüksek tepe", { s: 30, c: HOT })}`);
  },

  // Dere kapasitesi: gelen su > kesitin taşıyabileceği → taşkın
  culvert: () => svg(`
    <rect x="40" y="60" width="780" height="520" rx="22" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.1)"/>
    <rect x="940" y="60" width="780" height="520" rx="22" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.1)"/>
    ${T(430, 110, "Normal yağış", { s: 34 })}${T(1330, 110, "Aşırı yağış", { s: 34, c: HOT })}
    <path d="M140,250 L240,480 L620,480 L720,250" fill="none" stroke="#f4efe9" stroke-width="6"/>
    <path d="M200,390 L250,480 L610,480 L660,390 Z" fill="${ICE}" fill-opacity=".55"/>${T(430, 540, "su kesitin içinde kalır", { s: 26, c: MUTED })}
    <rect x="980" y="380" width="700" height="140" fill="${ICE}" fill-opacity=".35"/>
    <path d="M1040,250 L1140,480 L1520,480 L1620,250" fill="none" stroke="#f4efe9" stroke-width="6"/>
    <path d="M1060,300 L1140,480 L1520,480 L1600,300 Z" fill="${ICE}" fill-opacity=".7"/>
    ${[1000, 1650].map(x => `<line x1="${x + (x < 1300 ? 60 : -60)}" y1="290" x2="${x}" y2="360" stroke="${HOT}" stroke-width="5" marker-end="url(#arr)"/>`).join("")}
    ${T(1330, 210, "gelen su > kesitin kapasitesi", { s: 30, c: HOT })}${T(1330, 560, "dere taşar, sokaklar dere yatağına döner", { s: 26, c: MUTED })}`),

  blazar: () => svg(`
    <ellipse cx="300" cy="310" rx="230" ry="70" fill="rgba(255,140,60,.15)" stroke="rgba(255,140,60,.4)"/>
    <circle cx="300" cy="310" r="40" fill="url(#coreG)" filter="url(#glow)"/>
    <path d="M330,295 L760,250 L760,370 L330,325 Z" fill="${HOT}" fill-opacity=".35" filter="url(#glow)"/>
    ${T(300, 430, "Blazar: jeti bize dönük", { s: 28, c: MUTED })}${T(300, 470, "aktif galaksi", { s: 28, c: MUTED })}
    <line x1="780" y1="310" x2="1440" y2="310" stroke="${HOT}" stroke-width="7" stroke-dasharray="18 12" marker-end="url(#arr)" filter="url(#glow)"/>
    ${T(1110, 280, "~290 TeV nötrino", { s: 34, c: HOT })}
    <circle cx="1560" cy="310" r="90" fill="url(#earthG)" stroke="${ICE}" stroke-opacity=".5" stroke-width="3"/>
    <rect x="1330" y="430" width="400" height="110" rx="18" fill="rgba(255,90,20,.12)" stroke="${NEON}" stroke-width="3"/>
    ${T(1530, 475, "1 dakika içinde", { s: 30 })}${T(1530, 515, "dünyaya uyarı", { s: 30 })}
    ${T(1110, 380, "TXS 0506+056 · yön farkı 0,06°", { s: 28, c: MUTED })}`),
};

const credit = (ep, id) => { const c = (ep.photo_credits || {})[id]; return c ? `<div class="credit">${c.line ? esc(c.line) : `Fotoğraf: ${esc(c.author)} · ${esc(c.license)} · Wikimedia Commons`}</div>` : ""; };
const photoUrl = (ep, id) => `../../../assets/photos/${ep.photo_credits[id].file}`;

function photoInset(d, ep) {
  const text = `<div class="pcontent" style="height:auto">${d.kicker ? `<div class="k">${esc(d.kicker)}</div>` : ""}
    ${d.title ? `<h1 style="font-size:${d.layout === "wide" ? 84 : 96}px">${esc(d.title)}</h1>` : ""}${d.label ? `<div class="l">${esc(d.label)}</div>` : ""}</div>`;
  const img = `<img src="${photoUrl(ep, d.photo)}" style="object-position:${d.pos || "center"}">`;
  return `<div class="p${d.layout}">${text}${img}</div>${credit(ep, d.photo)}`;
}

function clipScene(d, ep) {
  const c = (ep.clips || {})[d.clip] || {};
  const cred = c.line ? `<div class="credit">${esc(c.line)}</div>` : "";
  const text = `<div class="pcontent" style="height:auto">${d.kicker ? `<div class="k">${esc(d.kicker)}</div>` : ""}
    ${d.title ? `<h1 style="font-size:${d.layout === "wide" ? 84 : 96}px">${esc(d.title)}</h1>` : ""}${d.label ? `<div class="l">${esc(d.label)}</div>` : ""}</div>`;
  if (d.layout === "side" || d.layout === "wide") {
    const a = d.aspect || 16 / 9;
    const w = d.layout === "side" ? Math.min(760, 690 * a) : Math.min(1760, 470 * a);
    const box = `<div class="clipbox" style="width:${Math.round(w)}px;height:${Math.round(w / a)}px;${d.layout === "wide" ? "margin:0 auto" : ""}"></div>`;
    return `<div class="p${d.layout}">${text}${box}</div>${cred}`;
  }
  return `<div class="clipgrad"></div><div class="pcontent">${d.kicker ? `<div class="k">${esc(d.kicker)}</div>` : ""}${d.value ? `<div class="v neon">${esc(d.value)}</div>` : ""}
    ${d.title ? `<h1>${esc(d.title)}</h1>` : ""}${d.label ? `<div class="l">${esc(d.label)}</div>` : ""}</div>${cred}`;
}

const DOC = {
  clip: (d, ep) => clipScene(d, ep),
  photo: (d, ep) => d.layout === "side" || d.layout === "wide" ? photoInset(d, ep) : `<div class="bgphoto" style="background-image:url('${photoUrl(ep, d.photo)}');background-position:${d.pos || "center"}"></div>
    <div class="pcontent">${d.kicker ? `<div class="k">${esc(d.kicker)}</div>` : ""}${d.value ? `<div class="v neon">${esc(d.value)}</div>` : ""}
    ${d.title ? `<h1>${esc(d.title)}</h1>` : ""}${d.label ? `<div class="l">${esc(d.label)}</div>` : ""}
    ${d.items ? `<ul>${d.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div>${credit(ep, d.photo)}`,
  title: (d) => `<div class="dtitle">${d.logo ? '<img src="../../../assets/logo.png">' : ""}<h1 class="${d.logo ? "" : "neon"}">${esc(d.title)}</h1><div class="s">${esc(d.sub)}</div></div>`,
  chapter: (d) => `<div class="chap"><div class="n neon">${String(d.num).padStart(2, "0")}</div><div>
    <div class="lbl">BÖLÜM ${d.num}</div><h1>${esc(d.title)}</h1><div class="s">${esc(d.sub || "")}</div></div></div>`,
  stat: (d) => `<div class="stat"><div class="v neon">${esc(d.value)}</div><div class="l">${esc(d.label)}</div><div class="f">${esc(d.foot || "")}</div></div>`,
  timeline: (d) => `<div class="tl"><div class="row" style="grid-template-columns:repeat(${d.items.length},1fr)"><div class="line"></div>${d.items.map((it, i) =>
      `<div class="item ${i === d.active ? "on" : i < d.active ? "done" : ""}"><div class="y">${esc(it.year)}</div><div class="dot"></div><div class="t">${esc(it.text)}</div></div>`).join("")}</div></div>`,
  list: (d) => `<div class="dlist"><h2>${esc(d.title)}</h2><ul>${d.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}</div>`,
  quote: (d) => `<div class="dquote"><div class="mark neon">“</div><div class="t">${esc(d.text)}</div><div class="w">— ${esc(d.who)}</div></div>`,
  laureate: (d, ep) => `<div class="laur">${d.photo ? `<div class="medal ph" style="background-image:url('${photoUrl(ep, d.photo)}')"></div>${credit(ep, d.photo)}` : '<div class="medal neon">2026</div>'}<div><h1 lang="en">${esc(d.name)}</h1><ul>${d.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div></div>`,
  diagram: (d) => `<div class="diag">${DIAGRAMS[d.name](d)}<div class="cap">${esc(d.caption || "")}</div></div>`,
};

function renderRichThumb(ep, t) {
  document.body.className = "thumb";
  const bg = t.photo ? `<div class="bgphoto" style="background-image:url('${photoUrl(ep, t.photo)}')"></div>` : "";
  const face = t.logo ? `<img class="tlogoimg" src="../../../assets/photos/${t.logo}">`
    : t.face ? `<div class="tface" style="background-image:url('${photoUrl(ep, t.face)}')"></div>` : "";
  document.getElementById("root").innerHTML = `${bg}<div class="rthumb" lang="${t.lang || "tr"}">
    <img class="tlogo" src="../../../assets/logo.png">
    <div class="tchip">${esc(t.chip)}</div>
    <div class="tbig neon">${esc(t.big)}</div>
    <div class="tsub">${esc(t.sub)}</div>
    <div class="tfoot">${esc(t.foot || "")}</div></div>${face}`;
  // Yazılar daireye taşmasın: sığana kadar küçült (tek satır kalır)
  const maxW = t.face || t.logo ? 760 : 1160;
  for (const el of document.querySelectorAll(".rthumb .tbig, .rthumb .tsub, .rthumb .tchip")) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > maxW && size > 18) { size -= 2; el.style.fontSize = size + "px"; }
  }
}

function renderVerticalThumb(ep, t) {
  // Instagram Reels/hikâye kapağı 1080x1920; önemli içerik ortadaki 1080x1350 alanda (ızgara kırpması)
  document.body.className = "vthumb";
  const bg = t.photo ? `<div class="bgphoto" style="background-image:url('${photoUrl(ep, t.photo)}');background-position:${t.pos || "40% center"}"></div>` : "";
  document.getElementById("root").innerHTML = `${bg}<div class="vgrad"></div><div class="vwrap" lang="${t.lang || "tr"}">
    <img class="vbrand" src="../../../assets/logo.png">
    ${t.logo ? `<img class="vlogo" src="../../../assets/photos/${t.logo}">` : ""}
    <div class="tchip">${esc(t.chip)}</div>
    <div class="vbig neon">${esc(t.big)}</div>
    ${(t.lines || []).map(l => `<div class="vline">${esc(l)}</div>`).join("")}
    <div class="vfoot">${esc(t.foot || "")}</div>
    ${t.cta ? `<div class="vcta"><svg viewBox="0 0 28 20" class="ytlogo"><rect width="28" height="20" rx="5.6" fill="#FF0000"/><path d="M11.2 14.3V5.7L18.5 10z" fill="#fff"/></svg>
      <span>${esc(t.cta.text)}</span><b>${esc(t.cta.handle)}</b></div>` : ""}</div>`;
  for (const el of document.querySelectorAll(".vwrap .vbig, .vwrap .vline, .vwrap .tchip")) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 960 && size > 18) { size -= 2; el.style.fontSize = size + "px"; }
  }
}

function renderThumb(ep) {
  if (ep.thumbnail) return renderRichThumb(ep, ep.thumbnail);
  document.body.className = "thumb";
  document.getElementById("root").innerHTML = `<div class="thumbwrap"><div class="q neon">?</div>
    <img src="../../../assets/logo.png"><h1>${esc(ep.thumbnail_text)}</h1><div class="chip">${ep.format === "doc" ? esc(ep.stories[0].kicker) : "5N1K · " + esc(ep.date_label)}</div></div>`;
}
</script>
