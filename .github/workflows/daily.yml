name: Günlük bülten

on:
  schedule:
    # Her gün 07:47 (İstanbul) = 04:47 UTC
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "YouTube'a yüklensin mi?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # GPU yok; CUDA'lı torch yerine küçük CPU sürümü
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ses modeli önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2

      - name: Ses kaydını aç
        env:
          VOICE_PASSPHRASE: ${{ secrets.VOICE_PASSPHRASE }}
        run: |
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$VOICE_PASSPHRASE" \
            -d assets/voice/voice.tar.gpg | tar -C assets/voice -xf -

      - name: Haber + senaryo
        run: python -m bosnroll script

      - name: Seslendirme + video
        run: python -m bosnroll video

      - name: YouTube'a yükle (private)
        if: github.event_name == 'schedule' || inputs.upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m bosnroll upload

      - name: Videoyu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_id }}
          path: |
            episodes/*/video.mp4
            episodes/*/thumbnail.jpg
            episodes/*/subtitles.srt
          retention-days: 14

      - name: Senaryoyu ve kullanılan haberleri kaydet
        if: success()
        run: |
          git config user.name "bosnroll-bot"
          git config user.email "bosnroll-bot@users.noreply.github.com"
          git add episodes/
          git commit -m "Bülten: $(date -u +%F)" || exit 0
          git push
